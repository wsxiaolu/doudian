# =============================================================================
# build.yml — Windows 便携包 + Android APK/AAB
# -----------------------------------------------------------------------------
# iOS IPA 由专门的 .github/workflows/build-ios.yml 负责（云端 macOS 编译，
# 产出未签名 IPA 供 Sideloadly + 免费 Apple ID 自签安装）。
# 这样拆分是为了避免每次 push 同时跑两份 macOS 构建白白消耗 10 倍分钟。
# =============================================================================

name: Build (Windows / Android)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 取消同一分支上仍在运行的旧工作流，省 CI 分钟
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Windows：出可便携运行的 Release 目录（doudian_shop.exe + sqlite3.dll）
  # ===========================================================================
  build-windows:
    name: Windows 便携包
    # 显式固定 VS 2022 镜像；windows-latest 可能指向 VS 2026，Flutter 3.27 不识别其生成器
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 初始化 Visual Studio 2022 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows --release
        run: flutter build windows --release

      - name: 复制 sqlite3.dll（sqflite 在 Windows 上的原生依赖）
        shell: pwsh
        run: |
          $s = Get-ChildItem -Path "$env:LOCALAPPDATA\Pub\Cache" -Recurse -Filter sqlite3.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($s) {
            Copy-Item $s.FullName 'build\windows\x64\runner\Release\sqlite3.dll' -Force -ErrorAction SilentlyContinue
            Write-Host "[ok] copied $($s.FullName)"
          } else {
            Write-Host "[warn] sqlite3.dll not found in pub cache"
          }

      - name: 上传 Windows 便携包
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: warn

  # ===========================================================================
  # Android：出 app-release.apk + app-release.aab（无 key.properties 时回退 debug 签名）
  # ===========================================================================
  build-android:
    name: Android APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: flutter build appbundle --release
        run: flutter build appbundle --release

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

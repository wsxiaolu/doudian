# =============================================================================
# build-ios.yml — 云端 macOS 编译，产出「未签名 IPA」供 Sideloadly 自签
# -----------------------------------------------------------------------------
# 适用场景：
#   没有 $99 Apple 开发者账号，用「免费 Apple ID + Windows 端 Sideloadly」
#   把 IPA 自签安装到 iPhone。本工作流只负责云端编译 + 打包成 IPA 壳，
#   真正的签名在 Windows 上由 Sideloadly 用你的免费 Apple ID 完成。
#
# 产物位置：
#   Actions 页面 → 某次 run → Artifacts → ios-ipa-sideloadly（doudian_shop.ipa）
#
# 说明：
#   - 全程不需要任何 Apple 证书 / Secrets，仓库 Secrets 保持为空即可。
#   - macOS 构建分钟在 GitHub Free 计划下按 10 倍扣除，频繁 push 注意额度；
#     不需要时可在 Actions 页手动 "Run workflow"，或仅打 tag（见 on 配置）触发。
#   - 想正式上架 / 出 TestFlight IPA，再单独配 APPLE_CERT_* Secrets 走签名分支。
# =============================================================================

name: Build iOS IPA (Sideloadly)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 取消同一分支上仍在运行的旧构建，省 CI 分钟
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: iOS IPA（未签名壳）
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # —— 环境参数 ——
      FLUTTER_VERSION: '3.27.0'        # 固定 Flutter 版本，保证可复现
      IPA_NAME: doudian_shop.ipa       # 产出的 IPA 文件名
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 确保 CocoaPods 已安装
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -v 1.15.2
          fi
          pod --version

      - name: 拉取 Dart 依赖
        run: flutter pub get

      - name: 安装 iOS 原生依赖（pod install）
        run: (cd ios && pod install)

      # --no-codesign：完全不签名，只产出未签名的 Runner.app
      # （签名留给 Windows 端的 Sideloadly 用免费 Apple ID 完成）
      - name: 编译 iOS（--no-codesign，产出未签名 Runner.app）
        run: flutter build ios --release --no-codesign

      # 把 Runner.app 按标准 IPA 结构（Payload/Runner.app）打包成 .ipa
      # 必须用 zip -r（带 Payload 目录名），不可用 ditto Payload（会丢掉 Payload 这层目录）
      # -y 保留符号链接，避免 Frameworks 里的 .dylib 软链失效
      - name: 打包成未签名 IPA（供 Sideloadly 用免费 Apple ID 自签）
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -y "$IPA_NAME" Payload
          echo "✅ 已生成 IPA: $(pwd)/$IPA_NAME"
          ls -lh "$IPA_NAME"

      - name: 校验 IPA 结构
        run: |
          cd build/ios/iphoneos
          unzip -l "$IPA_NAME" | head -40
          python3 -c "import zipfile; z=zipfile.ZipFile('$IPA_NAME'); assert 'Payload/Runner.app/Info.plist' in z.namelist(), 'IPA 结构异常'; print('✅ IPA 结构校验通过：Payload/Runner.app/Info.plist 存在')"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-sideloadly
          path: build/ios/iphoneos/doudian_shop.ipa
          if-no-files-found: error
